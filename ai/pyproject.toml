[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startupflow-ai"
version = "0.1.0"
description = "Deal Memo Copilot: hybrid RAG + evaluation over StartupFlow deal memos"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["startupflow_ai"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"scripts/make_corpus.py" = ["E501"]  # hand-written corpus prose
