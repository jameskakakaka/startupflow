# One-command local stack: docker compose up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: startupflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  ai:
    build: ./ai
    ports: ["8000:8000"]
    volumes: [models:/models]

volumes:
  pgdata:
  models:
